{% extends 'base.html' %}
{% block title %}Product Page|{{block.super}}{% endblock %}
{% block content %}
<h2>Products</h2>
<a href="{% url 'product_create' %}" class="btn btn-success mb-3">Add Product</a>
<div>
    {% for p in products %}
<div class="card" style="width: 18rem;">
    {% if p.image %}
  <img src="{{p.image.url}}" class="card-img-top" alt="Product Image">
    {% else %}
    <p class="card-text">No Image</p>
    {% endif %}
  <div class="card-body">
    <h5 class="card-title">{{p.title}}</h5>
    <p class="card-text">{{p.price}}</p>
      <p class="card-text">{{p.description}}</p>
    <a href="{% url 'product_update' p.pk %}" class="btn btn-primary">Edit</a>
      <a href="{% url 'product_delete' p.pk %}" class="btn btn-danger">Delete</a>
    <a href="{% url 'order_create' p.pk %}" class="btn btn-success">Order</a>
  </div>
    </div>
    {% endfor %}
    </div>
{% endblock %}
