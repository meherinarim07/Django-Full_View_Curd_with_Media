{% extends 'base.html' %}
{% block title %}Update {% endblock %}
{% block content %}
<h2>Update Product</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{% url 'products' %}" class="btn btn-danger">Cancel</a>
</form>
{% endblock %}
