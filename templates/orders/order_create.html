{% extends 'base.html' %}
{% block title %}Order{% endblock %}
{% block content %}
<h2>Order the following Product:</h2>
<p><b>{{product}}</b></p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p}}
    <button type="submit" class="btn btn-success">Submit</button>
    <a href="{% url 'products' %}"class="btn btn-danger">Cancel</a>
</form>

{% endblock %}
