{% extends 'base.html' %}
{% block title %} DeleteOrder{% endblock %}
{% block content %}
<h2>Delete Order</h2>
<p>Are u sure u want to delete the:<b>{{order.customer_name}}</b></p>
<form method="post" onsubmit="return confirm('Are u sure?')">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'orders' %}"class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
