{% extends 'base.html' %}
{% block title %}Review update|{{block.super}}{% endblock %}
{% block content %}
<h2>Add Review</h2>
<form method="post">
    {% csrf_token %}
    {{form.as_p}}
    <button type="success" class="btn btn-success">Update</button>
    <a href="{% url 'reviews' %}" class="btn btn-danger">Cancel</a>
</form>
{% endblock %}
