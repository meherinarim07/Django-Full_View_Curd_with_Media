{% extends 'base.html' %}
{% block title %}Reviews{% endblock %}
{% block content %}
<h2>Reviews:</h2>
<a href="{% url 'review_create' %}" class="btn  btn-success">Add Review</a>
<table class="table">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Product</th>
      <th scope="col">Reviewer</th>
      <th scope="col">Rating</th>
      <th scope="col">Comment</th>
      <th scope="col">Functions</th>
    </tr>
  </thead>
  <tbody>
  {% for r in reviews %}
    <tr>
      <th scope="row">{{r.id}}</th>
      <td>{{r.product.title}}</td>
      <td>{{or.reviewer_name}}</td>
      <td>{{r.rating}}</td>
      <td>{{r.comment}}</td>
      <td>
      <a href="{% url 'review_update' r.pk %}" class="btn btn-primary">Edit</a>
      <a href="{% url 'review_delete' r.pk %}" class="btn btn-danger">Delete</a>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
<a href="{% url 'home' %}" class="btn btn-primary">Home</a>
{% endblock %}
